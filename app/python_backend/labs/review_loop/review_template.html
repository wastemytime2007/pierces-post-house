<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cut Review</title>
<style>
  :root {
    --bg: #1c1c1e; --panel: #2c2c2e; --line: rgba(255,255,255,.10); --text: #f5f5f7; --dim: #aeaeb4;
    --accent: #0391d8; --pin: #f4690b; --clipA: #3a3a3c; --clipB: #48484a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .meta { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .stage { position: relative; }
  video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; display: block; }
  #draw { position: absolute; pointer-events: none; touch-action: none; }
  #draw.on { pointer-events: auto; cursor: crosshair; }
  .stage.drawing video { outline: 2px solid var(--pin); }
  .bar { position: relative; height: 34px; margin: 10px 0 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; overflow: hidden; }
  .seg { position: absolute; top: 0; bottom: 0; }
  .seg:nth-child(odd) { background: var(--clipA); }
  .seg:nth-child(even) { background: var(--clipB); }
  .pin { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--pin); }
  .head { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }
  #beatmap { position: relative; margin: 4px 0 2px; }
  #beatmap:empty { display: none; }
  .lane { position: relative; height: 18px; margin: 2px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .lane .lb { position: absolute; left: 5px; top: 1px; font-size: 10px; line-height: 14px; color: var(--dim); pointer-events: none; z-index: 2; text-transform: uppercase; letter-spacing: .04em; background: rgba(13, 20, 32, .82); padding: 0 4px; border-radius: 3px; }
  .blk { position: absolute; top: 2px; bottom: 2px; min-width: 3px; border-radius: 3px; background: var(--accent); opacity: .7; cursor: pointer; }
  .lane.Captions .blk { background: #00ade1; } .lane.Music .blk { background: #38d66b; } .lane.SFX .blk { background: #ffd400; }
  .lane.Clips .blk { background: #3b5a85; opacity: .85; box-shadow: inset -1px 0 0 var(--bg, #0d1420); }
  .lane.Suspects .blk { background: #ff4d6d; opacity: .8; }
  .lane.Bleep .blk { background: #ff9f1c; }
  .lane.BleepEdit { height: 40px; border-color: #ff9f1c; touch-action: none; }
  .blk.bl { background: #ff9f1c; opacity: .92; top: 4px; bottom: 4px; cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #1a1000; white-space: nowrap; overflow: hidden; touch-action: none; min-width: 10px; }
  .blk.bl.sel { outline: 2px solid #fff; outline-offset: 1px; z-index: 2; }
  .blk.bl .hl, .blk.bl .hr { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; background: rgba(0, 0, 0, .38); }
  .blk.bl .hl { left: 0; } .blk.bl .hr { right: 0; }
  #bleepPanel { background: var(--panel); border: 1px solid #ff9f1c; border-radius: 8px; padding: 8px 12px; margin: 6px 0 10px; }
  #bleepPanel .bp-h { font-size: 13px; color: var(--dim); } #bleepPanel .bp-h b { color: var(--text); }
  #bleepPanel .hint { color: var(--dim); font-size: 12px; }
  #bleepPanel .scan { font-size: 13px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  #bleepPanel button.mini { padding: 2px 8px; margin: 2px 3px 0 0; font-size: 12px; }
  #bz { position: relative; height: 96px; background: #0b111b; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: none; cursor: crosshair; }
  #bz canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bzb { position: absolute; inset: 0; }
  #bzph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; display: none; z-index: 3; }
  .zbx { position: absolute; top: 6px; bottom: 22px; background: rgba(255, 159, 28, .42); border: 2px solid #ff9f1c; border-radius: 4px; cursor: grab; touch-action: none; }
  .zbx.sel { border-color: #fff; background: rgba(255, 159, 28, .55); z-index: 2; }
  .zbx .hl, .zbx .hr { position: absolute; top: 0; bottom: 0; width: 14px; background: rgba(255, 159, 28, .9); cursor: ew-resize; }
  .zbx .hl { left: -2px; border-radius: 3px 0 0 3px; } .zbx .hr { right: -2px; border-radius: 0 3px 3px 0; }
  .zbx .bt { position: absolute; left: 16px; right: 16px; top: 2px; text-align: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 3px #000; white-space: nowrap; overflow: hidden; pointer-events: none; }
  .lane.Callout .blk { background: var(--pin); } .lane.Card .blk { background: #b48cff; }
  .tk { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: #cfd9e8; cursor: pointer; }
  .lane.Edits .tk { background: #38d66b; width: 4px; }
  .blk.active, .tk.active { opacity: 1; box-shadow: 0 0 0 1px #fff; }
  .tk::before { content: ""; position: absolute; top: 0; bottom: 0; left: -6px; right: -6px; }
  .blk:hover, .tk:hover { opacity: 1; outline: 1px dashed #fff; }
  .blk.picked, .tk.picked { opacity: 1; outline: 2px solid #fff; outline-offset: 1px; z-index: 2; }
  .note .tgt { color: var(--pin); font-size: 12px; font-weight: 600; }
  .lane.Clips .cutpt { position: absolute; top: 0; bottom: 0; width: 25px; margin-left: -12px; cursor: pointer; z-index: 2; }
  .lane.Clips .cutpt::after { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 4px; background: rgba(255, 255, 255, .55); border-radius: 2px; }
  .lane.Clips .cutpt:hover::after { background: #fff; left: 9px; width: 6px; }
  .lane.Clips .cutpt.on::after { background: #00ade1; width: 6px; left: 9px; }
  .lane.Clips .cutpt.manual::after { background: #f4690b; width: 6px; left: 9px; }
  .cutbadge { position: absolute; z-index: 4; transform: translateX(-50%); font-size: 10px; line-height: 14px; padding: 0 5px; border-radius: 7px; background: #00ade1; color: #02131f; font-weight: 700; pointer-events: none; white-space: nowrap; }
  .cutbadge.manual { background: #f4690b; color: #1a0a00; }
  #cutmenu { position: fixed; z-index: 50; min-width: 190px; background: #14213a; border: 1px solid #3b5a85; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 4px; font-size: 13px; color: #e6edf7; }
  #cutmenu .mi { padding: 6px 10px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; white-space: nowrap; }
  #cutmenu .mi:hover { background: #24406b; }
  #cutmenu .sub { display: none; position: absolute; left: 100%; top: -4px; min-width: 170px; background: #14213a; border: 1px solid #3b5a85; border-radius: 8px; padding: 4px; }
  #cutmenu .sub.flip { left: auto; right: 100%; }
  #cutmenu .has:hover > .sub, #cutmenu .has.open > .sub { display: block; }
  #cutmenu .has { position: relative; }
  #cutmenu .hd { padding: 4px 10px; font-size: 11px; color: #8da2c0; }
  #gedit { position: absolute; pointer-events: none; overflow: hidden; }
  #gedit.pick { pointer-events: auto; cursor: crosshair; }
  #gghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  #gbox { position: absolute; border: 2px dashed #ffd400; box-sizing: border-box; cursor: move; pointer-events: auto; touch-action: none; display: none; background: rgba(255, 212, 0, .07); }
  #gpanel { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0 12px; }
  #gpanel h2 { margin: 0 0 6px; }
  .grow { display: flex; gap: 10px; align-items: baseline; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 4px; cursor: pointer; font-size: 13px; }
  .grow.sel { border-color: #ffd400; box-shadow: inset 0 0 0 1px #ffd400; }
  .grow .gt { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 92px; }
  .grow .gc { margin-left: auto; color: #38d66b; font-size: 12px; }
  #gctl { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
  #gctl input[type=range] { width: 200px; }
  #gwords { margin-top: 8px; font-size: 13px; }
  #gwords label { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 5px; }
  #gwords input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font: inherit; min-width: 0; }
  #gwords .gl { display: grid; grid-template-columns: 54px 1fr 84px; gap: 6px; align-items: center; margin-bottom: 4px; }
  #gwords .gl select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px; font: inherit; }
  #gwords .gl .gt { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; cursor: pointer; }
  #gwords .gl.ch input[type=text], #gwords label.ch input[type=text] { border-color: #ffd400; }
  #glines { padding-right: 4px; }
  #gsum { color: var(--dim); font-size: 12px; margin-top: 6px; min-height: 16px; }
  #beatmap .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; z-index: 3; }
  .now { min-height: 22px; color: var(--dim); font-size: 13px; margin-bottom: 8px; }
  .now b { color: var(--text); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { border-color: var(--pin); box-shadow: inset 0 0 0 1px var(--pin); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; }
  .spacer { flex: 1; }
  #editor { display: none; background: var(--panel); border: 1px solid var(--pin); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  #editor textarea { width: 100%; min-height: 64px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; resize: vertical; }
  #editor .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .tools.off { opacity: .45; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; }
  h2 { font-size: 15px; margin: 16px 0 8px; }
  .note { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--panel); }
  .note .t { color: var(--pin); font-variant-numeric: tabular-nums; font-weight: 600; cursor: pointer; }
  .note .where { color: var(--dim); font-size: 12px; }
  .note .drawn { color: var(--pin); font-size: 12px; }
  .thumb { position: relative; width: 240px; max-width: 100%; margin-top: 6px; }
  .thumb video { width: 100%; display: block; border-radius: 4px; background: #05090f; }
  .thumb canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .note .x { color: var(--dim); background: none; border: none; padding: 0 4px; }
  .empty { color: var(--dim); font-size: 13px; }
  #changes { display: none; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #changes h2 { margin: 0 0 8px; }
  .chg { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .chg .k { font-variant-numeric: tabular-nums; font-weight: 600; cursor: pointer; color: #38d66b; }
  .chg.no .k { color: var(--pin); cursor: default; }
  .chg .q { color: var(--dim); }
  @media (max-width: 600px) { .note { grid-template-columns: 1fr; } }
  /* Layout (2026-10-21): picture and its transport on the left, the inspector on the right, the ribbon under both; one screen, one scroll (the inspector's). */
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  main { max-width: none; margin: 0; padding: 12px; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px 16px; overflow: hidden; }
  #left { grid-area: 1 / 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #right { grid-area: 1 / 2; overflow-y: auto; min-height: 0; padding-right: 2px; }
  #ribbon { grid-area: 2 / 1 / 3 / 3; }
  .stage { flex: 1; min-height: 0; display: flex; }
  video { max-height: none; width: 100%; height: 100%; object-fit: contain; }
  #transport { margin: 8px 0 0; flex: none; }
  .now { min-height: 18px; margin: 6px 0 0; font-size: 12px; }
  #transcount { font-size: 12px; color: var(--dim); min-height: 0; margin: 2px 0; }
  #transcount:empty { display: none; }
  #detailsBox { margin-top: 14px; color: var(--dim); font-size: 12px; }
  #detailsBox summary { cursor: pointer; }
  #detailsBox .meta { margin-top: 6px; line-height: 1.5; word-break: break-word; }
  button, select { padding: 4px 10px; min-height: 28px; }
  button.primary { background: #0a72b8; border-color: #0a72b8; }
  .lane .lb { text-transform: none; letter-spacing: 0; font-size: 11px; }
  h2 { font-size: 13px; margin: 12px 0 6px; }
  :focus-visible { outline: 2px solid #4cb3ee; outline-offset: 1px; }

  .tabs { display: flex; gap: 2px; padding: 2px; background: var(--panel); border-radius: 7px; margin-bottom: 10px; position: sticky; top: 0; z-index: 3; }
  .tabs button { flex: 1; border: 0; background: none; min-height: 24px; padding: 0 8px; border-radius: 5px; color: var(--dim); }
  .tabs button[aria-selected=true] { background: #2b3644; color: var(--text); }
  #right[data-tab=graphics] .pane-notes, #right[data-tab=graphics] .pane-details,
  #right[data-tab=notes] .pane-graphics, #right[data-tab=notes] .pane-details,
  #right[data-tab=details] .pane-graphics, #right[data-tab=details] .pane-notes { display: none; }
  #gnone { display: none; }
  #right.nographics #gnone { display: block; }
  #detailsBox { display: none; }

  /* Polish (2026-10-21): quiet fills, soft depth, same language as the app around it */
  button, select { background: rgba(128,128,140,.22); border: 0; border-radius: 7px; transition: background .12s ease, transform .12s ease; }
  button:hover { background: rgba(128,128,140,.34); border: 0; }
  button:active { transform: scale(.98); }
  button.primary { background: #0a72b8; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(0,0,0,.25); }
  button.primary:hover { background: #2284c6; }
  button.on { box-shadow: inset 0 0 0 1.5px var(--pin); }
  #gpanel, #editor, #changes, .note, .grow { border: 0; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 0 0 .5px rgba(255,255,255,.07); }
  .grow { border-radius: 9px; box-shadow: 0 0 0 .5px rgba(255,255,255,.10); }
  .grow.sel { box-shadow: inset 0 0 0 1.5px #ffd400; }
  .bar, .lane { border: 0; border-radius: 8px; background: rgba(255,255,255,.06); }
  .tabs { background: rgba(128,128,140,.2); border-radius: 8px; }
  .tabs button { background: none; }
  .tabs button[aria-selected=true] { background: #48484a; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  textarea, input[type=text] { border: .5px solid rgba(255,255,255,.14) !important; border-radius: 8px !important; }
  video { border-radius: 10px; }

  /* Transport and details (2026-10-21): the picture's controls are quiet; the technical lines live under Details */
  #left .now { display: none; }
  #nowCopy b { color: var(--text); font-weight: 600; }
  .pane-details h2 { margin: 4px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
  .pane-details .meta { margin-bottom: 14px; }
  #transport { gap: 6px; align-items: center; }
  #play { min-width: 92px; border-radius: 999px; font-weight: 600; }
  #back, #fwd { background: transparent; color: var(--dim); }
  #back:hover, #fwd:hover { background: rgba(128,128,140,.22); color: var(--text); }
  .time { min-width: 0; margin-left: 4px; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  button.tint { background: rgba(76,179,238,.16); color: #4cb3ee; }
  button.tint:hover { background: rgba(76,179,238,.26); }
  #rate { min-height: 28px; padding: 0 6px; background: transparent; color: var(--dim); }

  /* The ribbon (2026-10-21): muted lane colors, one saturation, and a real ruler where the empty bar was */
  .lane.Clips .blk { background: #4a6fa5; opacity: .92; }
  .lane.Captions .blk { background: #3b8fc4; }
  .lane.Music .blk { background: #4d9f6f; }
  .lane.SFX .blk { background: #c4a035; }
  .lane.Graphics .blk { background: #6f7ae0; }
  .lane.Callout .blk { background: #e0723a; } .lane.Card .blk { background: #9b7fe0; }
  .lane.Suspects .blk { background: #d9566f; } .lane.Bleep .blk { background: #e08a1e; }
  .lane.Edits .tk { background: #4cb86a; }
  .blk { opacity: .88; }
  .blk:hover, .tk:hover { outline: 1px solid rgba(255,255,255,.7); }
  .bar { height: 34px; margin: 6px 0 2px; background: transparent; border-radius: 0; border-bottom: 1px solid rgba(255,255,255,.14); overflow: visible; }
  .seg:nth-child(odd) { background: rgba(255,255,255,.035); } .seg:nth-child(even) { background: rgba(255,255,255,.07); }
  .tick { position: absolute; bottom: 0; width: 1px; height: 8px; background: rgba(255,255,255,.32); pointer-events: none; }
  .tick span { position: absolute; bottom: 12px; left: 0; transform: translateX(-50%); font-size: 11px; line-height: 1; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tick:first-child span { transform: none; }

  /* Notes (2026-10-21): drawing tools appear when drawing is chosen; copy and download are quiet */
  #tools { gap: 4px; }
  #tools.off { opacity: 1; }
  #tools.off > :not(#drawToggle) { display: none; }
  #tools button { min-height: 26px; padding: 0 9px; font-size: 12px; }
  #tools [data-tool].on { background: rgba(76,179,238,.2); color: #4cb3ee; box-shadow: none; }
  #copy, #dl { background: transparent; color: var(--dim); min-height: 26px; font-size: 12px; }
  #copy:hover, #dl:hover { background: rgba(128,128,140,.22); color: var(--text); }
  #count { font-size: 13px; }

  /* Filmstrip: frames of the picture along the ribbon, like an editing app. Made in the page from the preview itself. */
  #gguides { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #gguides i { position: absolute; background: #00ade1; box-shadow: 0 0 0 .5px rgba(0,0,0,.45); opacity: .9; }
  #gguides i.v { top: 0; bottom: 0; width: 1px; }
  #gguides i.h { left: 0; right: 0; height: 1px; }
  #gguides i.safe { background: rgba(255,255,255,.55); }
  #wave { position: relative; height: 30px; margin: 0 0 6px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.04); cursor: pointer; }
  #wave canvas { display: block; width: 100%; height: 100%; }
  #wave .fph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.5); pointer-events: none; }
  #wave .wb { position: absolute; top: 0; bottom: 0; background: rgba(244,105,11,.34); pointer-events: none; }
  #filmstrip { position: relative; height: 46px; margin: 0 0 6px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.05); cursor: pointer; }
  #filmstrip canvas { display: block; width: 100%; height: 100%; }
  #filmstrip .fph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.5); pointer-events: none; }
  #filmstrip.building::after { content: "Reading the picture…"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; color: var(--dim); }
  @media (max-width: 900px) and (min-width: 681px) { main { grid-template-columns: minmax(0, 1fr) 270px; gap: 8px 12px; padding: 10px; } }
  @media (max-width: 680px) { main { display: block; height: auto; overflow: visible; } #left { height: 60vh; } #ribbon { max-height: none; } }

</style>
</head>
<body>
<main>
  <h1 id="title" class="vh"></h1>
  <section id="left">
    <div class="stage" id="stage">
      <video id="v" preload="auto" playsinline></video>
      <canvas id="draw"></canvas>
      <div id="gedit"><img id="gghost" alt=""><div id="gbox"></div></div>
    </div>
    <div class="now" id="now"></div>
    <div class="row" id="transport">
      <button id="play" class="primary">▶︎  Play</button>
      <button id="back" title="Back 5 seconds">−5 s</button>
      <button id="fwd" title="Forward 5 seconds">+5 s</button>
      <button id="layersBtn" style="display:none" title="Show or hide the callouts, captions, music and effects placed on this cut">Layers: on</button>
      <select id="rate" aria-label="Speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
      <span class="time" id="time"></span>
      <span class="spacer"></span>
      <button id="addDraw" title="Draw on the frame to point at something (d)">Draw (d)</button>
      <button id="add" class="tint">Add note (n)</button>
    </div>
  </section>
  <aside id="right" data-tab="notes">
    <div class="tabs" role="tablist" aria-label="Inspector"><button role="tab" data-t="graphics" id="tabGraphics">Graphics</button><button role="tab" data-t="notes" id="tabNotes">Notes</button><button role="tab" data-t="details">Details</button></div>
    <div class="pane pane-graphics">
    <div id="changes"></div>
    <div id="gpanel">
      <h2>On-screen graphics</h2>
      <div class="empty" style="margin-bottom:6px">Choose one, then drag its box on the picture or scale it. Apply graphic changes (top right) makes the next version.</div>
      <div class="tools" style="margin:0 0 6px"><button id="gpick">Pick on the picture</button><button id="greset" style="display:none">Put this one back</button><button id="gresetall" style="display:none">Put all back</button></div>
      <div id="glist"></div>
      <div id="gctl"><label>Size <input type="range" id="gscale" min="25" max="300" step="1" value="100"> <span id="gscaleout">100%</span></label><span id="gwhen" class="empty"></span></div>
      <div id="gwords"></div>
      <div id="gsum"></div>
    </div>
    <div class="empty" id="gnone">No graphics on this cut. Run Get Creative to add a title card and name tags.</div>
    </div>
    <div class="pane pane-notes">
    <div id="editor">
      <div id="editorAt" class="where"></div>
      <div class="tools" id="tools">
        <button id="drawToggle">Draw on frame</button>
        <button data-tool="pen">Pen</button>
        <button data-tool="ellipse">Circle</button>
        <button data-tool="arrow">Arrow</button>
        <button data-tool="rect">Box</button>
        <span id="swatches"></span>
        <button id="undo">Undo</button>
        <button id="clear">Clear drawing</button>
      </div>
      <textarea id="text" placeholder="What is wrong or what should change here? (circle or draw on the frame to point at it)"></textarea>
      <div class="row" style="margin:8px 0 0">
        <button id="save" class="primary">Save note</button>
        <button id="cancel">Cancel</button>
        <span class="hint">Enter saves. Shift+Enter adds a line. Esc cancels.</span>
      </div>
    </div>
    <div class="row">
      <h2 style="margin:0" id="count"></h2>
      <span class="spacer"></span>
      <button id="submit" class="primary" style="display:none" title="Send these notes to the editor, who makes the changes and opens the next version">Submit changes</button>
      <button id="copy">Copy all feedback</button>
      <button id="dl">Download JSON</button>
    </div>
    <div id="notes"></div>
    </div>
    <div class="pane pane-details"><h2>At the playhead</h2><div class="meta" id="nowCopy"></div><h2>This cut</h2><div class="meta" id="meta"></div></div>
  </aside>
  <section id="ribbon">
    <div class="bar" id="bar"><div class="head" id="head"></div></div>
    <div id="beatmap"></div>
    <div id="transcount"></div>
  </section>
</main>
<script>
const DATA = /*__DATA__*/null;
const v = document.getElementById('v'), bar = document.getElementById('bar'), head = document.getElementById('head');
const cv = document.getElementById('draw'), stage = document.getElementById('stage');
const LIVE = !!DATA.preview_live;                                  /* bleeps are editable here: the speech is whole in these previews and the bleeps are made live */
const FULL = LIVE ? DATA.preview_live : (DATA.preview_full || null);
let showLayers = !!FULL;
const SRC = () => (showLayers && FULL) ? FULL : (LIVE ? DATA.preview_live_clean : 'preview.mp4');
v.src = SRC();
if (FULL) {
  const lb = document.getElementById('layersBtn');
  lb.style.display = '';
  lb.onclick = () => {
    const t = v.currentTime, was = !v.paused, r = v.playbackRate;
    showLayers = !showLayers;
    lb.textContent = 'Layers: ' + (showLayers ? 'on' : 'off');
    v.src = SRC();
    v.addEventListener('loadedmetadata', () => { v.currentTime = t; v.playbackRate = r; if (was) v.play(); }, { once: true });
    document.querySelectorAll('.thumb video').forEach(x => { x.src = SRC(); });
  };
}
const KEY = 'review_loop:' + DATA.sequence + ':' + DATA.duration.toFixed(2);
let notes = [];
try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { notes = []; }
/* Transport the way an NLE does it: J back, K stop, L forward (press again for faster), comma and period step a frame, Space plays, I and O mark a range to note, Home and End jump.
   Typing in a note or a field is left alone. */
(() => {
  let rate = 0;
  const FPS = (DATA.fps || 30);
  const set = (r) => {
    rate = r;
    if (r === 0) { v.pause(); v.playbackRate = 1; return; }
    v.playbackRate = Math.min(4, Math.abs(r));
    if (r > 0) { v.play().catch(() => {}); }
    else { v.pause(); }                                      /* backwards: stepped, since a video element cannot play in reverse */
  };
  let back = null;
  const backwards = () => { if (back) clearInterval(back); back = setInterval(() => { v.currentTime = Math.max(0, v.currentTime - (Math.abs(rate) / FPS)); }, 1000 / 30); };
  const stopBack = () => { if (back) { clearInterval(back); back = null; } };
  const step = (n) => { v.pause(); v.currentTime = Math.max(0, Math.min(DATA.duration || v.duration || 0, v.currentTime + n / FPS)); };
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'j') { e.preventDefault(); stopBack(); set(rate >= 0 ? -1 : Math.max(-4, rate * 2)); backwards(); }
    else if (k === 'k') { e.preventDefault(); stopBack(); set(0); }
    else if (k === 'l') { e.preventDefault(); stopBack(); set(rate <= 0 ? 1 : Math.min(4, rate * 2)); }
    else if (k === ' ') { e.preventDefault(); stopBack(); set(v.paused ? 1 : 0); }
    else if (e.key === ',') { e.preventDefault(); stopBack(); rate = 0; step(-1); }
    else if (e.key === '.') { e.preventDefault(); stopBack(); rate = 0; step(1); }
    else if (k === 'i') { window.MARK_IN = v.currentTime; tellHost({ type: 'review:mark', in: window.MARK_IN, out: window.MARK_OUT }); }
    else if (k === 'o') { window.MARK_OUT = v.currentTime; tellHost({ type: 'review:mark', in: window.MARK_IN, out: window.MARK_OUT }); }
    else if (e.key === 'Home') { e.preventDefault(); stopBack(); v.currentTime = 0; }
    else if (e.key === 'End') { e.preventDefault(); stopBack(); v.currentTime = Math.max(0, (DATA.duration || v.duration || 1) - 0.05); }
  });
})();

function tellHost(msg) { try { if (window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {} tellHost({ type: 'review:count', n: notes.length }); }

const fmt = s => { const m = Math.floor(s / 60); return String(m).padStart(2, '0') + ':' + (s - m * 60).toFixed(1).padStart(4, '0'); };
const clipAt = t => DATA.clips.find(c => t >= c.start && t < c.end) || DATA.clips[DATA.clips.length - 1];
function where(t) {
  const c = clipAt(t);
  const srcT = c.src_in + Math.max(0, t - c.start);
  return { clip: c.idx, of: DATA.clips.length, source: c.source, source_sec: +srcT.toFixed(2), text: 'clip ' + c.idx + '/' + DATA.clips.length + ' · ' + c.source + ' @ ' + fmt(srcT) };
}

document.getElementById('title').textContent = DATA.sequence;
document.getElementById('meta').textContent = DATA.clips.length + ' clips · ' + fmt(DATA.duration) + ' · ' + DATA.audio_source
  + (DATA.layers ? ' · on top: ' + DATA.layers.map(l => l.name.replace(/\.(mov|wav)$/, '') + ' ' + fmt(l.start) + '-' + fmt(l.end)).join(', ') : '')
  + (DATA.built ? ' · built ' + DATA.built : '');

DATA.clips.forEach(c => {
  const d = document.createElement('div');
  d.className = 'seg';
  d.style.left = (c.start / DATA.duration * 100) + '%';
  d.style.width = ((c.end - c.start) / DATA.duration * 100) + '%';
  d.title = 'clip ' + c.idx + ' · ' + c.source;
  bar.insertBefore(d, head);
});

const BEATS = [];
(function () {
  const bm = document.getElementById('beatmap');
  if (!DATA.beatmap || !DATA.beatmap.length || !bm) return;
  DATA.beatmap.forEach(L => {
    if (LIVE && L.name === 'Bleep') return;                       /* replaced by the editable lane below */
    const lane = document.createElement('div');
    lane.className = 'lane ' + L.name;
    const lb = document.createElement('span');
    lb.className = 'lb';
    lb.textContent = L.name;
    lane.appendChild(lb);
    L.items.forEach(it => {
      const tick = L.kind === 'ticks';
      const el = document.createElement('div');
      el.className = tick ? 'tk' : 'blk';
      el.style.left = (it.start / DATA.duration * 100) + '%';
      if (!tick) el.style.width = Math.max(0.25, (it.end - it.start) / DATA.duration * 100) + '%';
      el.title = L.name + ' · ' + fmt(it.start) + (tick ? '' : '-' + fmt(it.end)) + ' · ' + it.label;
      el.onclick = e => {
        if (e.shiftKey) { v.currentTime = Math.max(0, it.start - (tick ? 1 : 0.3)); return; }
        const onCut = (tick && (L.name === 'Cuts' || L.name === 'Edits') && typeof CUTS !== 'undefined') ? CUTS.find(c => Math.abs(c.sec - it.start) < 0.15) : null;
        if (onCut) { e.stopPropagation(); openCutMenu(onCut.sec, e); return; }          /* a cut: the menu (Add transition...), not a note */
        if (/caption/i.test(L.name) && editCaptionAt(it.start)) { e.stopPropagation(); return; }   /* a caption: edit the words, where you saw them */
        openElementNote(L.name, tick, it, el, e);
      };
      lane.appendChild(el);
      BEATS.push({ lane: L.name, tick, it, el });
    });
    bm.appendChild(lane);
  });
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.id = 'ph';
  bm.appendChild(ph);
})();

/* Click a cut: the boundaries between clips on the Clips lane open a menu at the mouse (Add transition > Film Impact Push > Left / Up / Down / Right).
   The choices are kept with this version like notes are, and the app reads them with the notes and puts Ryan's whoosh under each chosen cut.
   Left is applied by the installed Premiere plugin by itself; Up, Down and Right get a marker for his own preset (a plugin cannot set a push's direction). */
const TRKEY = KEY + ':transitions';
let TRANS = [];                                                  /* [{ timeline_sec, direction }] */
try { TRANS = JSON.parse(localStorage.getItem(TRKEY) || '[]'); } catch (e) { TRANS = []; }
const DIRS = { left: '←', up: '↑', down: '↓', right: '→' };
function saveTrans() { try { localStorage.setItem(TRKEY, JSON.stringify(TRANS)); } catch (e) {} tellHost({ type: 'review:transitions', n: TRANS.length }); }
function transAt(sec) { return TRANS.find(x => Math.abs(x.timeline_sec - sec) < 0.02); }
const CUTS = [];
(function () {
  const lane = document.querySelector('#beatmap .lane.Clips');
  if (!lane || !DATA.duration) return;
  const clips = BEATS.filter(b => b.lane === 'Clips').map(b => b.it).sort((a, b) => a.start - b.start);
  clips.slice(1).forEach((it, i) => {
    const prev = clips[i];
    if (Math.abs(prev.end - it.start) > 0.1) return;            /* a gap is not a cut */
    const el = document.createElement('div');
    el.className = 'cutpt';
    el.style.left = (it.start / DATA.duration * 100) + '%';
    el.title = 'Cut at ' + fmt(it.start) + '. Click to add a transition.';
    el.onclick = e => { e.stopPropagation(); openCutMenu(it.start, e); };
    lane.appendChild(el);
    CUTS.push({ sec: it.start, el });
  });
  drawTrans();
})();
function drawTrans() {
  document.querySelectorAll('#beatmap .cutbadge').forEach(b => b.remove());
  const bm = document.getElementById('beatmap');
  CUTS.forEach(c => {
    const x = transAt(c.sec);
    c.el.classList.toggle('on', !!x && x.direction === 'left');
    c.el.classList.toggle('manual', !!x && x.direction !== 'left');
    if (!x) return;
    const b = document.createElement('div');
    b.className = 'cutbadge' + (x.direction === 'left' ? '' : ' manual');
    b.textContent = 'Push';
    b.style.left = (c.sec / DATA.duration * 100) + '%';
    b.style.top = '-8px';
    bm.appendChild(b);
  });
  const n = TRANS.length;
  const s = document.getElementById('transcount');
  if (s) s.textContent = n ? n + ' Film Impact Push' + (n === 1 ? '' : 'es') + ' chosen' : '';
}
function closeCutMenu() { const m = document.getElementById('cutmenu'); if (m) m.remove(); }
function openCutMenu(sec, e) {
  closeCutMenu();
  const m = document.createElement('div');
  m.id = 'cutmenu';
  const cur = transAt(sec);
  m.innerHTML = '<div class="hd">Cut at ' + fmt(sec) + '</div>'
    + '<div class="mi has"><span>Add transition</span><span>\u25B8</span><div class="sub">'
    + '<div class="mi" data-set="left"><span>Film Impact Push</span><span>' + (cur ? '\u2713' : '') + '</span></div>'
    + '</div></div>'
    + (cur ? '<div class="mi" data-clear="1"><span>Remove transition here</span></div>' : '');
  document.body.appendChild(m);
  m.style.left = (e.clientX + 6) + 'px';
  m.style.top = (e.clientY + 6) + 'px';
  const r = m.getBoundingClientRect();
  if (r.right > window.innerWidth - 4) m.style.left = Math.max(4, window.innerWidth - r.width - 4) + 'px';
  if (r.bottom > window.innerHeight - 4) m.style.top = Math.max(4, e.clientY - r.height - 6) + 'px';
  if (m.getBoundingClientRect().right + 200 > window.innerWidth) m.querySelectorAll('.sub').forEach(s => s.classList.add('flip'));
  m.querySelectorAll('.has').forEach(h => h.addEventListener('click', ev => { if (ev.target.closest('[data-set]')) return; ev.stopPropagation(); h.classList.toggle('open'); }));
  m.querySelectorAll('[data-set]').forEach(it => it.addEventListener('click', ev => {
    ev.stopPropagation();
    TRANS = TRANS.filter(x => Math.abs(x.timeline_sec - sec) >= 0.02).concat([{ timeline_sec: sec, direction: it.dataset.set }]).sort((a, b) => a.timeline_sec - b.timeline_sec);
    saveTrans(); drawTrans(); closeCutMenu();
  }));
  const clr = m.querySelector('[data-clear]');
  if (clr) clr.addEventListener('click', ev => { ev.stopPropagation(); TRANS = TRANS.filter(x => Math.abs(x.timeline_sec - sec) >= 0.02); saveTrans(); drawTrans(); closeCutMenu(); });
  m.addEventListener('click', ev => ev.stopPropagation());
}
document.addEventListener('click', closeCutMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCutMenu(); });

/* ---------- editable bleeps: drag to move, pull an edge to resize, hear it as you play ---------- */
const BL = { spans: [], auto: [], sel: -1, gate: false, stopAt: null, lead: 0.05, zw: 4, zc: null };
(function () {
  if (!LIVE) return;
  const bm = document.getElementById('beatmap');
  BL.auto = DATA.live_bleeps.map(b => ({ start: b.start, end: b.end }));
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY + ':bleeps') || 'null'); } catch (e) { saved = null; }
  BL.spans = Array.isArray(saved) ? saved : BL.auto.map(b => Object.assign({}, b));
  const lane = document.createElement('div');
  lane.className = 'lane BleepEdit';
  const lb = document.createElement('span');
  lb.className = 'lb'; lb.textContent = 'bleeps (drag)';
  lane.appendChild(lb);
  bm.insertBefore(lane, document.getElementById('ph'));

  const panel = document.createElement('div');
  panel.id = 'bleepPanel';
  panel.innerHTML = '<div class="bp-h"><b>Bleeps.</b> Drag a box to move it, pull its left or right edge to resize it. The strip below is a close-up of the selected bleep with the loudness of the speech drawn in: line the edges up with the sound. '
    + 'Play over it to hear the change. The preview is close to live (about a twentieth of a second); the file you download is applied frame-exact.</div>'
    + '<div class="row" style="margin:6px 0"><button data-zw="2">Zoom 2 s</button><button data-zw="4">4 s</button><button data-zw="8">8 s</button><span class="hint" id="bzRange"></span></div>'
    + '<div id="bz"><canvas id="bzc"></canvas><div id="bzb"></div><div id="bzph"></div></div>'
    + '<div class="row" style="margin:6px 0 0"><button id="blAdd">+ Bleep at the playhead</button><button id="blPlay">Play the selected one</button>'
    + '<button id="blDel">Delete selected</button><button id="blReset">Back to automatic</button><span class="spacer"></span>'
    + '<span id="blInfo" class="hint"></span><button id="blDl" class="primary">Download bleep edits</button></div>'
    + '<div class="hint">Alt + left/right arrow nudges the selected bleep by 0.02 s (Shift: 0.1 s). Delete removes it. Click in the close-up to move the playhead there.</div>';
  document.getElementById('now').parentNode.insertBefore(panel, document.getElementById('now'));
  if (DATA.scan) {                                              /* say what the automatic scan did, so "no bleeps" is not read as "it failed" */
    const sc = document.createElement('div');
    sc.className = 'scan';
    const n = DATA.scan.bleeped;
    sc.innerHTML = '<b>Automatic scan:</b> heard ' + DATA.scan.words_heard + ' words, ' + (n ? 'bleeped ' + n + ' place' + (n === 1 ? '' : 's') + ' (they are the orange boxes).' : 'found no curse words, so there are no bleeps yet. If you hear one, add it with the button below and drag it over the word: that is how the tool learns.')
      + (DATA.scan.flagged.length ? ' <span class="hint">Worth a listen (words it was unsure of or that were stretched; most are ordinary): </span>' : '');
    DATA.scan.flagged.forEach(f => { const b = document.createElement('button'); b.className = 'mini'; b.textContent = f.start.toFixed(1) + ' s "' + f.word + '"'; b.onclick = () => { v.currentTime = Math.max(0, f.start - 1); }; sc.appendChild(b); });
    panel.insertBefore(sc, panel.firstChild);
  }
  const zwrap = panel.querySelector('#bz'), zc = panel.querySelector('#bzc'), zb = panel.querySelector('#bzb'), zph = panel.querySelector('#bzph');

  const save = () => { try { localStorage.setItem(KEY + ':bleeps', JSON.stringify(BL.spans)); } catch (e) {} };
  const r2 = x => Math.round(x * 100) / 100;
  const mid = b => (b.start + b.end) / 2;
  const edited = () => JSON.stringify(BL.spans.map(b => [b.start, b.end])) !== JSON.stringify(BL.auto.map(b => [b.start, b.end]));
  function info() {
    const s = BL.spans[BL.sel];
    document.getElementById('blInfo').textContent = (s ? 'selected: ' + s.start.toFixed(2) + ' to ' + s.end.toFixed(2) + ' s (' + (s.end - s.start).toFixed(2) + ' s)' : BL.spans.length + ' bleep' + (BL.spans.length === 1 ? '' : 's'))
      + (edited() ? ' · edited' : ' · as found');
  }
  /* the close-up window: BL.zw seconds wide, centred on BL.zc (or on the selected bleep, or the first one, or the playhead) */
  function zrange() {
    const c = BL.zc != null ? BL.zc : (BL.sel >= 0 && BL.spans[BL.sel] ? mid(BL.spans[BL.sel]) : v.currentTime);
    let t0 = Math.max(0, c - BL.zw / 2), t1 = t0 + BL.zw;
    if (t1 > DATA.duration) { t1 = DATA.duration; t0 = Math.max(0, t1 - BL.zw); }
    return [t0, t1];
  }
  function zdraw() {
    const [t0, t1] = zrange(), W = zwrap.clientWidth, H = zwrap.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!W) return;
    BL.win = [t0, t1];
    zc.width = W * dpr; zc.height = H * dpr;
    const g = zc.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = '#0b111b'; g.fillRect(0, 0, W, H);
    const env = DATA.envelope || [], hz = DATA.envelope_hz || 100, sec = t1 - t0;
    g.fillStyle = '#3b5a85';
    for (let x = 0; x < W; x++) {
      const a = Math.floor((t0 + x / W * sec) * hz), b = Math.max(a + 1, Math.floor((t0 + (x + 1) / W * sec) * hz));
      let m = 0; for (let k = a; k < b && k < env.length; k++) m = Math.max(m, env[k]);
      const h = m / 100 * (H - 20); g.fillRect(x, H - 16 - h, 1, h);
    }
    g.fillStyle = '#8fa1bd'; g.font = '10px sans-serif';
    for (let i = Math.ceil(t0 * 10); i <= Math.floor(t1 * 10); i++) {
      const x = (i / 10 - t0) / sec * W, major = i % (sec > 3 ? 5 : 1) === 0;
      g.fillRect(x, H - (major ? 14 : 6), 1, major ? 14 : 6);
      if (major) g.fillText((i / 10).toFixed(1), x + 2, H - 16 + 10 - 10 + 1);
    }
    zb.innerHTML = '';
    BL.spans.forEach((b, i) => {
      if (b.end < t0 || b.start > t1) return;
      const el = document.createElement('div');
      el.className = 'zbx' + (i === BL.sel ? ' sel' : '');
      el.style.left = ((Math.max(b.start, t0) - t0) / sec * 100) + '%';
      el.style.width = ((Math.min(b.end, t1) - Math.max(b.start, t0)) / sec * 100) + '%';
      el.innerHTML = '<div class="hl"></div><span class="bt">' + b.start.toFixed(2) + ' to ' + b.end.toFixed(2) + '</span><div class="hr"></div>';
      el.addEventListener('pointerdown', e => drag(e, i, e.target.classList.contains('hl') ? 'l' : e.target.classList.contains('hr') ? 'r' : 'move', 'zoom'));
      zb.appendChild(el);
    });
    document.getElementById('bzRange').textContent = t0.toFixed(2) + ' to ' + t1.toFixed(2) + ' s, about ' + Math.round(W / sec) + ' px a second';
    zph.style.display = (v.currentTime >= t0 && v.currentTime <= t1) ? 'block' : 'none';
    zph.style.left = ((v.currentTime - t0) / sec * 100) + '%';
  }
  function draw() {
    lane.querySelectorAll('.bl').forEach(e => e.remove());
    BL.spans.forEach((b, i) => {
      const el = document.createElement('div');
      el.className = 'blk bl' + (i === BL.sel ? ' sel' : '');
      el.style.left = (b.start / DATA.duration * 100) + '%';
      el.style.width = Math.max(0.4, (b.end - b.start) / DATA.duration * 100) + '%';
      el.title = 'bleep ' + b.start.toFixed(2) + ' to ' + b.end.toFixed(2) + ' s';
      el.innerHTML = '<div class="hl"></div><div class="hr"></div>';
      el.addEventListener('pointerdown', e => { if (BL.sel !== i) BL.zc = null; drag(e, i, e.target.classList.contains('hl') ? 'l' : e.target.classList.contains('hr') ? 'r' : 'move', 'lane'); });
      lane.appendChild(el);
    });
    info(); zdraw();
  }
  function drag(e, i, mode, where) {
    e.preventDefault(); e.stopPropagation();
    BL.sel = i;
    const [z0, z1] = zrange();
    BL.zc = (z0 + z1) / 2;                                        /* the close-up holds still while a box is dragged in it */
    const t0 = where === 'lane' ? 0 : z0, t1 = where === 'lane' ? DATA.duration : z1;
    const rect = (where === 'lane' ? lane : zwrap).getBoundingClientRect(), x0 = e.clientX, o = { start: BL.spans[i].start, end: BL.spans[i].end };
    const move = ev => {
      const dt = (ev.clientX - x0) / rect.width * (t1 - t0);
      let s = o.start, t = o.end;

      let m = 0;
      for (let k = a; k < b && k < env.length; k++) m = Math.max(m, env[k]);
      const h = Math.max(1, m / 100 * (H - 4));
      g.fillRect(x, (H - h) / 2, 1, h);                      /* mirrored around the middle, the way an editor expects */
    }
    el.querySelectorAll('.wb').forEach(n => n.remove());
    ((window.BL && BL.spans) || DATA.bleeps || []).forEach(b => {
      const d = document.createElement('div');
      d.className = 'wb';
      d.style.left = (b.start / dur * 100) + '%';
      d.style.width = Math.max(0.25, (b.end - b.start) / dur * 100) + '%';
      el.appendChild(d);
    });
  }
  draw();
  window.addEventListener('resize', draw);
  window.redrawWave = draw;                                   /* the bleep editor calls this when a bleep is moved */
})();

/* Filmstrip: a second, hidden video is stepped through the preview and a small frame is drawn for each slot. Nothing is sent anywhere; the main video is not touched. */
(() => {
  const dur = DATA.duration || 0;
  if (!dur || !bar || !bar.parentNode) return;
  const strip = document.createElement('div');
  strip.id = 'filmstrip';
  strip.className = 'building';
  const cvs = document.createElement('canvas');
  const ph = document.createElement('div');
  ph.className = 'fph';
  strip.appendChild(cvs);
  strip.appendChild(ph);
  bar.parentNode.insertBefore(strip, bar.nextSibling);
  strip.addEventListener('click', e => { const r = strip.getBoundingClientRect(); v.currentTime = Math.max(0, Math.min(dur, (e.clientX - r.left) / r.width * dur)); });
  const place = () => { ph.style.left = (v.currentTime / dur * 100) + '%'; requestAnimationFrame(place); };
  requestAnimationFrame(place);
  const clean = LIVE ? DATA.preview_live_clean : 'preview.mp4';
  const vid = document.createElement('video');
  vid.muted = true; vid.preload = 'auto'; vid.playsInline = true; vid.src = clean;
  const seek = t => new Promise(res => { const done = () => { vid.removeEventListener('seeked', done); res(); }; vid.addEventListener('seeked', done); vid.currentTime = t; setTimeout(done, 1500); });
  vid.addEventListener('loadedmetadata', async () => {
    const H = 92;                                                    /* drawn at twice the height it is shown at, so it is sharp on a retina screen */
    const W = Math.max(24, Math.round(H * (vid.videoWidth / vid.videoHeight)));
    const n = Math.min(80, Math.max(8, Math.ceil(strip.clientWidth / (W / 2))));
    cvs.width = n * W; cvs.height = H;
    const ctx = cvs.getContext('2d');
    for (let k = 0; k < n; k++) {
      await seek(Math.min(vid.duration - 0.05, (k + 0.5) / n * vid.duration));
      try { ctx.drawImage(vid, k * W, 0, W, H); } catch (e) { return; }
    }
    strip.classList.remove('building');
  });
})();
</script>
