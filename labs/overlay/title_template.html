<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: __W__px; height: __H__px; overflow: hidden; background: transparent; }
      #root { position: relative; width: __W__px; height: __H__px; background: transparent; font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      /* the title card: a brand-navy field over the picture (the speaker still faintly there) with faint diagonals */
      .hf-field { position: absolute; left: 0; top: 0; width: __W__px; height: __H__px; opacity: 0; background-color: rgba(3, 52, 89, 0.84);
                  background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.055) 0px, rgba(255, 255, 255, 0.055) 3px, rgba(255, 255, 255, 0) 3px, rgba(255, 255, 255, 0) 150px); }
      .hf-line { position: absolute; left: 0; width: __W__px; text-align: center; opacity: 0; font-weight: 900; line-height: 1; letter-spacing: -0.01em; text-shadow: 0 6px 18px rgba(0, 0, 0, 0.55); }
      .hf-small { color: #ffffff; text-transform: uppercase; letter-spacing: 0.02em; }
      .hf-big { color: #f4690b; text-transform: uppercase; }
      .hf-joke { color: #f4690b; text-transform: uppercase; }
      /* a step label: heavy white caps with a drop shadow, lower left, built a word at a time */
      .hf-label { position: absolute; opacity: 1; color: #ffffff; font-weight: 900; text-transform: uppercase; line-height: 1.18; letter-spacing: -0.005em;
                  text-shadow: 0 5px 14px rgba(0, 0, 0, 0.7), 0 2px 3px rgba(0, 0, 0, 0.6); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
__BODY__
    </div>
    <script>
      const EVENTS = /*__CFG__*/null;
      const tl = gsap.timeline({ paused: true });
      // hard on, hard off (the wallpaper reel builds in and clears out; it does not fade)
      EVENTS.forEach((e) => { tl.set(e.sel, { opacity: 1 }, e.on); if (e.off !== null) tl.set(e.sel, { opacity: 0 }, e.off); });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
