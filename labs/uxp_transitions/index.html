<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; padding: 10px; color: #ddd; }
    h3 { margin: 12px 0 4px 0; font-size: 13px; }
    label { display: block; margin-top: 6px; }
    input { width: 100%; box-sizing: border-box; }
    button { margin: 8px 6px 0 0; }
    textarea { width: 100%; height: 260px; box-sizing: border-box; font-family: monospace; font-size: 11px; margin-top: 8px; }
    .small { color: #999; }
  </style>
</head>
<body>
  <div class="small">Transition Lab v0.7</div>
  <label><input type="checkbox" id="auto" checked> Add transitions automatically to any sequence with "PH transition" markers (no click needed; keep this panel open)</label>
  <h3>1. What transitions can Premiere apply by name?</h3>
  <label>Show only names containing (blank = all)
    <input id="filter" value="impact">
  </label>
  <button id="list">List transitions</button>

  <h3>2. Add one at a cut in the active sequence</h3>
  <label>Transition match name (copy one from the list above)
    <input id="name" value="AE.AE_Impact_Push">
  </label>
  <label>Video track (1 = V1)
    <input id="track" value="1">
  </label>
  <label>Length in frames
    <input id="frames" value="6">
  </label>
  <label>Alignment (0.5 = centred on the cut)
    <input id="align" value="0.5">
  </label>
  <button id="first">Add at the FIRST cut only</button>
  <button id="all">Add at EVERY cut</button>
  <div class="small">Undo with Cmd+Z. Nothing else in the sequence is touched.</div>

  <h3>3. What settings does a transition have?</h3>
  <button id="describe">Describe the transitions in the open sequence</button>

  <textarea id="log" readonly></textarea>
  <script src="index.js"></script>
</body>
</html>
